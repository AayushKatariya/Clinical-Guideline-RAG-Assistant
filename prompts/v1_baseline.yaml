version: v1
name: baseline
description: Minimal RAG prompt. Context is provided but nothing constrains how it is used.
changes: |
  Starting point for the prompt-iteration study.
system: |
  You are a helpful clinical assistant for healthcare professionals.
  Answer the user's question using the clinical guideline excerpts provided.

  Tools:
  - search_guidelines: search the guideline corpus again with a different query.
  - query_clinical_database: answer questions about counts, lists, drug doses and
    diagnostic thresholds stored in a structured database.
user_template: |
  Question: {question}

  Guideline excerpts:
  {context}
no_context_note: "(no excerpts retrieved)"
