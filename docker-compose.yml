services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clinrag
      POSTGRES_PASSWORD: clinrag
      POSTGRES_DB: clinical
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + read-only role are applied on first start.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinrag -d clinical"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow

  api:
    build: .
    profiles: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinrag_readonly:readonly@postgres:5432/clinical
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlflow:
